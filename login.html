<!DOCTYPE html>
<html lang="en">
<head>
<script src="/supabase-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LineFlow – Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #070b14;
    --card:   #0d1320;
    --border: rgba(255,255,255,0.07);
    --text:   #e6f1ff;
    --muted:  #4a6080;
    --accent: #00d4ff;
    --purple: #9d4edd;
    --danger: #ff4d6d;
    --green:  #00ff88;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  /* ── animated background ── */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
  .orb1 { width: 600px; height: 600px; background: rgba(0,212,255,0.06);   top: -200px; left: -150px; }
  .orb2 { width: 500px; height: 500px; background: rgba(157,78,221,0.07);  bottom: -150px; right: -100px; }
  .orb3 { width: 350px; height: 350px; background: rgba(0,255,136,0.04);   top: 50%; left: 50%; transform: translate(-50%,-50%); }

  /* ── card ── */
  .login-wrap {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .login-card {
    width: 100%; max-width: 400px;
    background: rgba(13,19,32,0.85);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 18px;
    padding: 40px 36px 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,212,255,0.05);
    animation: cardIn .45s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  /* logo */
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(157,78,221,0.15));
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 22px; height: 22px; }
  .logo-text .name {
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #00d4ff, #9d4edd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-text .sub { font-size: 9px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }

  /* heading */
  .login-heading { margin-bottom: 6px; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .login-sub { font-size: 11px; color: var(--muted); margin-bottom: 28px; letter-spacing: 0.3px; }

  /* form */
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 7px;
  }
  .field-wrap { position: relative; }
  .field-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted); pointer-events: none;
  }
  .field input {
    width: 100%; height: 42px;
    padding: 0 42px 0 38px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: rgba(0,212,255,0.4);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
    background: rgba(0,212,255,0.03);
  }
  .field input::placeholder { color: var(--muted); }

  /* eye toggle */
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px;
    line-height: 0; transition: color 0.2s;
  }
  .eye-btn:hover { color: var(--accent); }
  .eye-btn svg { width: 15px; height: 15px; }

  /* role select */
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .role-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--muted); cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    transition: all 0.2s;
  }
  .role-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .role-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }
  .role-btn.selected { color: #e6f1ff; border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.08); box-shadow: 0 0 0 2px rgba(0,212,255,0.12); }

  /* remember */
  .remember-row {
    display: flex; align-items: center; gap: 8px;
    margin: 20px 0 22px; font-size: 11px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .remember-row input[type=checkbox] { display: none; }
  .custom-check {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .remember-row:hover .custom-check { border-color: var(--accent); }
  .remember-row input:checked ~ .custom-check {
    background: rgba(0,212,255,0.15); border-color: var(--accent);
  }
  .custom-check svg { width: 10px; height: 10px; color: var(--accent); opacity: 0; transition: opacity 0.15s; }
  .remember-row input:checked ~ .custom-check svg { opacity: 1; }

  /* submit btn */
  .btn-login {
    width: 100%; height: 44px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(157,78,221,0.15));
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .btn-login:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(0,212,255,0.22), rgba(157,78,221,0.22));
    border-color: rgba(0,212,255,0.5);
    box-shadow: 0 8px 24px rgba(0,212,255,0.12);
    transform: translateY(-1px);
  }
  .btn-login:active:not(:disabled) { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.45; cursor: not-allowed; }

  /* spinner inside button */
  .btn-spinner {
    display: none; width: 16px; height: 16px;
    border: 2px solid rgba(0,212,255,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .btn-spinner { display: block; }

  /* error / success banners */
  .banner {
    display: none; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    margin-bottom: 16px; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }
  .banner svg { width: 14px; height: 14px; flex-shrink: 0; }
  .banner.error  { display: flex; background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3); color: #ff6b8a; }
  .banner.success{ display: flex; background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.25); color: var(--green); }

  /* divider */
  .divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 18px; }
  .divider span { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--border); }

  /* register link */
  .register-note { text-align: center; font-size: 10px; color: var(--muted); }
  .register-note a { color: var(--accent); text-decoration: none; }
  .register-note a:hover { text-decoration: underline; }

  /* version badge */
  .version-badge {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: rgba(74,96,128,0.6); letter-spacing: 1px;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="name">LineFlow</div>
        <div class="sub">Operations Intelligence Suite</div>
      </div>
    </div>

    <div class="login-heading">Welcome back</div>
    <div class="login-sub">Sign in to access your dashboards</div>

    <!-- Error / Success banners -->
    <div class="banner error" id="err-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="err-text">Invalid credentials. Please try again.</span>
    </div>
    <div class="banner success" id="ok-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span>Login successful. Redirecting…</span>
    </div>

    <!-- Username -->
    <div class="field">
      <label>Username</label>
      <div class="field-wrap">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" spellcheck="false">
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        <button class="eye-btn" onclick="togglePw()" id="eye-btn" title="Toggle password visibility" type="button">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Role selector -->
    <div class="field">
      <label>Role</label>
      <div class="role-grid">
        <button class="role-btn selected" id="role-operator" onclick="selectRole('operator')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          Operator
        </button>
        <button class="role-btn" id="role-team-leader" onclick="selectRole('team-leader')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
          Team Leader
        </button>
        <button class="role-btn" id="role-group-leader" onclick="selectRole('group-leader')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
            <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
          </svg>
          Group Leader
        </button>
        <button class="role-btn" id="role-admin" onclick="selectRole('admin')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Admin
        </button>
      </div>
    </div>

    <!-- Remember me -->
    <label class="remember-row">
      <input type="checkbox" id="remember">
      <div class="custom-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      Keep me signed in for 7 days
    </label>

    <!-- Submit -->
    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <span class="btn-text">Sign In →</span>
      <div class="btn-spinner"></div>
    </button>

    <div class="divider"><span>secure access</span></div>
    <div class="register-note">
      No account? Contact your <a href="mailto:admin@lineflow.local">system administrator</a>
    </div>

  </div>
</div>

<div class="version-badge">LineFlow v2.0 &nbsp;·&nbsp; Operations Intelligence Suite</div>

<script>
  let selectedRole = 'operator';

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('role-' + role).classList.add('selected');
  }

  function togglePw() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    icon.innerHTML = isHidden
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  function showError(msg) {
    document.getElementById('err-text').textContent = msg;
    document.getElementById('err-banner').className = 'banner error';
    document.getElementById('ok-banner').className = 'banner';
  }

  function showSuccess() {
    document.getElementById('err-banner').className = 'banner';
    document.getElementById('ok-banner').className = 'banner success';
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    const btn = document.getElementById('login-btn');

    if (!username) { showError('Please enter your username.'); return; }
    if (!password) { showError('Please enter your password.'); return; }

    btn.classList.add('loading');
    btn.disabled = true;
    document.getElementById('err-banner').className = 'banner';
    document.getElementById('ok-banner').className = 'banner';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role: selectedRole, remember })
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        showError(data.error || 'Invalid credentials. Please try again.');
        btn.classList.remove('loading');
        btn.disabled = false;
        return;
      }

      // Store session
      const storage = remember ? localStorage : sessionStorage;
      storage.setItem('lf_token', data.token);
      storage.setItem('lf_user', JSON.stringify({ username: data.username, role: data.role, displayName: data.displayName }));

      showSuccess();
      setTimeout(() => { window.location.href = '/'; }, 900);

    } catch (e) {
      showError('Unable to reach server. Check your connection.');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // Redirect if already logged in
  (function checkExisting() {
    const tok = localStorage.getItem('lf_token') || sessionStorage.getItem('lf_token');
    if (tok) window.location.href = '/';
  })();
</script>
</body>
</html>
